name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    # Real Postgres so integration tests (*.int.spec.ts) run instead of being skipped.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: folio
          POSTGRES_PASSWORD: folio
          POSTGRES_DB: folio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U folio -d folio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://folio:folio@localhost:5432/folio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build

  go:
    name: Go market gateway (fmt, vet, race tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/market
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/market/go.mod
          cache-dependency-path: services/market/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build -o /dev/null ./cmd/market
      - name: Docker image builds
        run: docker build -q -t folio-market .
