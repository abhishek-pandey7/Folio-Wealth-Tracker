<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1000" viewBox="0 0 1160 1000" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Folio data model</title>
  <rect x="0" y="0" width="1160" height="1000" rx="16" fill="#ffffff"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1f2328">Data model (PostgreSQL)</text>
  <text x="32" y="70" font-size="15" fill="#57606a">Holdings are never stored: they are replayed from transactions. Blue notes are foreign keys; deleting a user cascades to all of their rows.</text>
  <text x="32" y="112" font-size="16" font-weight="700" fill="#1f2328">Per user</text>
  <rect x="32" y="128" width="256" height="136" rx="10" fill="#ffffff" stroke="#54aeff" stroke-width="1.5"/><path d="M32,138 a10,10 0 0 1 10,-10 h236 a10,10 0 0 1 10,10 v26 h-256 z" fill="#ddf4ff"/><text x="46" y="152" font-size="15" font-weight="700" fill="#1f2328">users</text><text x="46" y="180" font-size="13.5" font-weight="700" fill="#1f2328">id</text><text x="46" y="202" font-size="13.5" fill="#1f2328">email</text><text x="276" y="202" font-size="12.5" fill="#57606a" text-anchor="end">unique</text><text x="46" y="224" font-size="13.5" fill="#1f2328">display_name</text><text x="46" y="246" font-size="13.5" fill="#1f2328">base_currency</text>
  <rect x="312" y="128" width="256" height="180" rx="10" fill="#ffffff" stroke="#54aeff" stroke-width="1.5"/><path d="M312,138 a10,10 0 0 1 10,-10 h236 a10,10 0 0 1 10,10 v26 h-256 z" fill="#ddf4ff"/><text x="326" y="152" font-size="15" font-weight="700" fill="#1f2328">portfolios</text><text x="556" y="152" font-size="12" fill="#57606a" text-anchor="end">one per broker account</text><text x="326" y="180" font-size="13.5" font-weight="700" fill="#1f2328">id</text><text x="326" y="202" font-size="13.5" fill="#1f2328">user_id</text><text x="556" y="202" font-size="12.5" fill="#0969da" text-anchor="end">→ users</text><text x="326" y="224" font-size="13.5" fill="#1f2328">name</text><text x="326" y="246" font-size="13.5" fill="#1f2328">broker</text><text x="326" y="268" font-size="13.5" fill="#1f2328">currency</text><text x="556" y="268" font-size="12.5" fill="#57606a" text-anchor="end">INR or USD</text><text x="326" y="290" font-size="13.5" fill="#1f2328">drift_threshold</text>
  <rect x="312" y="340" width="256" height="114" rx="10" fill="#ffffff" stroke="#54aeff" stroke-width="1.5"/><path d="M312,350 a10,10 0 0 1 10,-10 h236 a10,10 0 0 1 10,10 v26 h-256 z" fill="#ddf4ff"/><text x="326" y="364" font-size="15" font-weight="700" fill="#1f2328">target_allocations</text><text x="326" y="392" font-size="13.5" fill="#1f2328">portfolio_id</text><text x="556" y="392" font-size="12.5" fill="#0969da" text-anchor="end">→ portfolios</text><text x="326" y="414" font-size="13.5" fill="#1f2328">instrument_id</text><text x="556" y="414" font-size="12.5" fill="#0969da" text-anchor="end">→ instruments</text><text x="326" y="436" font-size="13.5" fill="#1f2328">weight</text><text x="556" y="436" font-size="12.5" fill="#57606a" text-anchor="end">fraction</text>
  <rect x="592" y="128" width="256" height="290" rx="10" fill="#ffffff" stroke="#54aeff" stroke-width="1.5"/><path d="M592,138 a10,10 0 0 1 10,-10 h236 a10,10 0 0 1 10,10 v26 h-256 z" fill="#ddf4ff"/><text x="606" y="152" font-size="15" font-weight="700" fill="#1f2328">transactions</text><text x="836" y="152" font-size="12" fill="#57606a" text-anchor="end">the ledger</text><text x="606" y="180" font-size="13.5" font-weight="700" fill="#1f2328">id</text><text x="606" y="202" font-size="13.5" fill="#1f2328">portfolio_id</text><text x="836" y="202" font-size="12.5" fill="#0969da" text-anchor="end">→ portfolios</text><text x="606" y="224" font-size="13.5" fill="#1f2328">instrument_id</text><text x="836" y="224" font-size="12.5" fill="#0969da" text-anchor="end">→ instruments</text><text x="606" y="246" font-size="13.5" fill="#1f2328">sip_id</text><text x="836" y="246" font-size="12.5" fill="#0969da" text-anchor="end">→ sips</text><text x="606" y="268" font-size="13.5" fill="#1f2328">type</text><text x="836" y="268" font-size="12.5" fill="#57606a" text-anchor="end">buy, sell, dividend</text><text x="606" y="290" font-size="13.5" fill="#1f2328">trade_date</text><text x="606" y="312" font-size="13.5" fill="#1f2328">quantity</text><text x="836" y="312" font-size="12.5" fill="#57606a" text-anchor="end">NUMERIC</text><text x="606" y="334" font-size="13.5" fill="#1f2328">price</text><text x="836" y="334" font-size="12.5" fill="#57606a" text-anchor="end">NUMERIC</text><text x="606" y="356" font-size="13.5" fill="#1f2328">amount</text><text x="836" y="356" font-size="12.5" fill="#57606a" text-anchor="end">signed cash</text><text x="606" y="378" font-size="13.5" fill="#1f2328">fees</text><text x="606" y="400" font-size="13.5" fill="#1f2328">currency</text>
  <rect x="872" y="128" width="256" height="158" rx="10" fill="#ffffff" stroke="#54aeff" stroke-width="1.5"/><path d="M872,138 a10,10 0 0 1 10,-10 h236 a10,10 0 0 1 10,10 v26 h-256 z" fill="#ddf4ff"/><text x="886" y="152" font-size="15" font-weight="700" fill="#1f2328">instruments</text><text x="1116" y="152" font-size="12" fill="#57606a" text-anchor="end">shared by all users</text><text x="886" y="180" font-size="13.5" font-weight="700" fill="#1f2328">id</text><text x="886" y="202" font-size="13.5" fill="#1f2328">symbol</text><text x="1116" y="202" font-size="12.5" fill="#57606a" text-anchor="end">unique, MF-&lt;code&gt; for funds</text><text x="886" y="224" font-size="13.5" fill="#1f2328">name</text><text x="886" y="246" font-size="13.5" fill="#1f2328">asset_class</text><text x="886" y="268" font-size="13.5" fill="#1f2328">currency</text>
  <rect x="872" y="340" width="256" height="92" rx="10" fill="#ffffff" stroke="#54aeff" stroke-width="1.5"/><path d="M872,350 a10,10 0 0 1 10,-10 h236 a10,10 0 0 1 10,10 v26 h-256 z" fill="#ddf4ff"/><text x="886" y="364" font-size="15" font-weight="700" fill="#1f2328">watchlist_items</text><text x="886" y="392" font-size="13.5" fill="#1f2328">user_id</text><text x="1116" y="392" font-size="12.5" fill="#0969da" text-anchor="end">→ users</text><text x="886" y="414" font-size="13.5" fill="#1f2328">instrument_id</text><text x="1116" y="414" font-size="12.5" fill="#0969da" text-anchor="end">→ instruments</text>
  <rect x="32" y="488" width="256" height="180" rx="10" fill="#ffffff" stroke="#54aeff" stroke-width="1.5"/><path d="M32,498 a10,10 0 0 1 10,-10 h236 a10,10 0 0 1 10,10 v26 h-256 z" fill="#ddf4ff"/><text x="46" y="512" font-size="15" font-weight="700" fill="#1f2328">goals</text><text x="46" y="540" font-size="13.5" font-weight="700" fill="#1f2328">id</text><text x="46" y="562" font-size="13.5" fill="#1f2328">user_id</text><text x="276" y="562" font-size="12.5" fill="#0969da" text-anchor="end">→ users</text><text x="46" y="584" font-size="13.5" fill="#1f2328">name</text><text x="46" y="606" font-size="13.5" fill="#1f2328">target_amount</text><text x="46" y="628" font-size="13.5" fill="#1f2328">target_date</text><text x="46" y="650" font-size="13.5" fill="#1f2328">assumed_return</text>
  <rect x="312" y="488" width="256" height="114" rx="10" fill="#ffffff" stroke="#54aeff" stroke-width="1.5"/><path d="M312,498 a10,10 0 0 1 10,-10 h236 a10,10 0 0 1 10,10 v26 h-256 z" fill="#ddf4ff"/><text x="326" y="512" font-size="15" font-weight="700" fill="#1f2328">goal_holdings</text><text x="326" y="540" font-size="13.5" fill="#1f2328">goal_id</text><text x="556" y="540" font-size="12.5" fill="#0969da" text-anchor="end">→ goals</text><text x="326" y="562" font-size="13.5" fill="#1f2328">instrument_id</text><text x="556" y="562" font-size="12.5" fill="#0969da" text-anchor="end">→ instruments</text><text x="326" y="584" font-size="13.5" fill="#1f2328">share</text><text x="556" y="584" font-size="12.5" fill="#57606a" text-anchor="end">0 to 1</text>
  <rect x="592" y="488" width="256" height="246" rx="10" fill="#ffffff" stroke="#54aeff" stroke-width="1.5"/><path d="M592,498 a10,10 0 0 1 10,-10 h236 a10,10 0 0 1 10,10 v26 h-256 z" fill="#ddf4ff"/><text x="606" y="512" font-size="15" font-weight="700" fill="#1f2328">sips</text><text x="606" y="540" font-size="13.5" font-weight="700" fill="#1f2328">id</text><text x="606" y="562" font-size="13.5" fill="#1f2328">user_id</text><text x="836" y="562" font-size="12.5" fill="#0969da" text-anchor="end">→ users</text><text x="606" y="584" font-size="13.5" fill="#1f2328">portfolio_id</text><text x="836" y="584" font-size="12.5" fill="#0969da" text-anchor="end">→ portfolios</text><text x="606" y="606" font-size="13.5" fill="#1f2328">instrument_id</text><text x="836" y="606" font-size="12.5" fill="#0969da" text-anchor="end">→ instruments</text><text x="606" y="628" font-size="13.5" fill="#1f2328">goal_id</text><text x="836" y="628" font-size="12.5" fill="#0969da" text-anchor="end">→ goals</text><text x="606" y="650" font-size="13.5" fill="#1f2328">amount</text><text x="606" y="672" font-size="13.5" fill="#1f2328">day_of_month</text><text x="606" y="694" font-size="13.5" fill="#1f2328">active_from</text><text x="606" y="716" font-size="13.5" fill="#1f2328">status</text><text x="836" y="716" font-size="12.5" fill="#57606a" text-anchor="end">active, paused, stopped</text>
  <text x="32" y="802" font-size="16" font-weight="700" fill="#1f2328">Market data, shared and written by the cron Worker (Cloudflare deployment)</text>
  <rect x="32" y="818" width="256" height="158" rx="10" fill="#ffffff" stroke="#d4a72c" stroke-width="1.5"/><path d="M32,828 a10,10 0 0 1 10,-10 h236 a10,10 0 0 1 10,10 v26 h-256 z" fill="#fff8c5"/><text x="46" y="842" font-size="15" font-weight="700" fill="#1f2328">symbol_data</text><text x="46" y="870" font-size="13.5" font-weight="700" fill="#1f2328">symbol</text><text x="46" y="892" font-size="13.5" fill="#1f2328">name, exchange, currency</text><text x="46" y="914" font-size="13.5" fill="#1f2328">stats</text><text x="276" y="914" font-size="12.5" fill="#57606a" text-anchor="end">jsonb</text><text x="46" y="936" font-size="13.5" fill="#1f2328">quote</text><text x="276" y="936" font-size="12.5" fill="#57606a" text-anchor="end">jsonb</text><text x="46" y="958" font-size="13.5" fill="#1f2328">error, error_at</text>
  <rect x="312" y="818" width="256" height="158" rx="10" fill="#ffffff" stroke="#d4a72c" stroke-width="1.5"/><path d="M312,828 a10,10 0 0 1 10,-10 h236 a10,10 0 0 1 10,10 v26 h-256 z" fill="#fff8c5"/><text x="326" y="842" font-size="15" font-weight="700" fill="#1f2328">fund_data</text><text x="326" y="870" font-size="13.5" font-weight="700" fill="#1f2328">scheme_code</text><text x="326" y="892" font-size="13.5" fill="#1f2328">category_id</text><text x="326" y="914" font-size="13.5" fill="#1f2328">nav_date, seen_at</text><text x="326" y="936" font-size="13.5" fill="#1f2328">stats</text><text x="556" y="936" font-size="12.5" fill="#57606a" text-anchor="end">jsonb</text><text x="326" y="958" font-size="13.5" fill="#1f2328">error, error_at</text>
  <rect x="592" y="818" width="256" height="114" rx="10" fill="#ffffff" stroke="#d4a72c" stroke-width="1.5"/><path d="M592,828 a10,10 0 0 1 10,-10 h236 a10,10 0 0 1 10,10 v26 h-256 z" fill="#fff8c5"/><text x="606" y="842" font-size="15" font-weight="700" fill="#1f2328">market_cache</text><text x="836" y="842" font-size="12" fill="#57606a" text-anchor="end">stale-while-revalidate</text><text x="606" y="870" font-size="13.5" font-weight="700" fill="#1f2328">key</text><text x="606" y="892" font-size="13.5" fill="#1f2328">value</text><text x="836" y="892" font-size="12.5" fill="#57606a" text-anchor="end">jsonb</text><text x="606" y="914" font-size="13.5" fill="#1f2328">fetched_at</text>
  <rect x="872" y="818" width="256" height="114" rx="10" fill="#ffffff" stroke="#d4a72c" stroke-width="1.5"/><path d="M872,828 a10,10 0 0 1 10,-10 h236 a10,10 0 0 1 10,10 v26 h-256 z" fill="#fff8c5"/><text x="886" y="842" font-size="15" font-weight="700" fill="#1f2328">job_state</text><text x="1116" y="842" font-size="12" fill="#57606a" text-anchor="end">cron progress</text><text x="886" y="870" font-size="13.5" font-weight="700" fill="#1f2328">name</text><text x="886" y="892" font-size="13.5" fill="#1f2328">state</text><text x="1116" y="892" font-size="12.5" fill="#57606a" text-anchor="end">jsonb</text><text x="886" y="914" font-size="13.5" fill="#1f2328">report</text><text x="1116" y="914" font-size="12.5" fill="#57606a" text-anchor="end">jsonb</text>
</svg>
