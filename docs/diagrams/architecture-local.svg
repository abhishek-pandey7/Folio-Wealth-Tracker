<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="640" viewBox="0 0 1160 640" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Folio's local development stack</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="640" rx="16" fill="#ffffff"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1f2328">Local development stack</text>
  <text x="32" y="70" font-size="15" fill="#57606a">npm run dev starts all of it; Postgres runs in Docker. The browser only ever talks to the API.</text>

  <!-- Web -->
  <rect x="32" y="110" width="220" height="140" rx="12" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
  <text x="142" y="144" font-size="17" font-weight="700" fill="#1f2328" text-anchor="middle">Web app</text>
  <text x="142" y="168" font-size="13" fill="#57606a" text-anchor="middle">apps/web · :5173</text>
  <text x="142" y="198" font-size="14" fill="#1f2328" text-anchor="middle">React 19, Vite</text>
  <text x="142" y="220" font-size="14" fill="#1f2328" text-anchor="middle">TanStack Query</text>

  <!-- API -->
  <rect x="320" y="110" width="240" height="140" rx="12" fill="#fbefff" stroke="#c297ff" stroke-width="1.5"/>
  <text x="440" y="144" font-size="17" font-weight="700" fill="#1f2328" text-anchor="middle">API</text>
  <text x="440" y="168" font-size="13" fill="#57606a" text-anchor="middle">apps/api · :3000</text>
  <text x="440" y="198" font-size="14" fill="#1f2328" text-anchor="middle">NestJS 12, Drizzle</text>
  <text x="440" y="220" font-size="14" fill="#1f2328" text-anchor="middle">validates every response</text>

  <!-- Postgres -->
  <rect x="640" y="110" width="220" height="140" rx="12" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/>
  <text x="750" y="144" font-size="17" font-weight="700" fill="#1f2328" text-anchor="middle">PostgreSQL 17</text>
  <text x="750" y="168" font-size="13" fill="#57606a" text-anchor="middle">Docker · :5442</text>
  <text x="750" y="198" font-size="14" fill="#1f2328" text-anchor="middle">transaction ledger</text>
  <text x="750" y="220" font-size="14" fill="#1f2328" text-anchor="middle">SIPs, goals, stars</text>

  <!-- Go gateway -->
  <rect x="640" y="296" width="220" height="160" rx="12" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
  <text x="750" y="330" font-size="17" font-weight="700" fill="#1f2328" text-anchor="middle">Market gateway (Go)</text>
  <text x="750" y="354" font-size="13" fill="#57606a" text-anchor="middle">services/market · :8081</text>
  <text x="750" y="384" font-size="14" fill="#1f2328" text-anchor="middle">in-memory caches</text>
  <text x="750" y="406" font-size="14" fill="#1f2328" text-anchor="middle">singleflight, rate limits</text>
  <text x="750" y="428" font-size="14" fill="#1f2328" text-anchor="middle">background warmers</text>

  <!-- Upstreams -->
  <rect x="930" y="296" width="198" height="160" rx="12" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="1029" y="330" font-size="17" font-weight="700" fill="#1f2328" text-anchor="middle">Market data</text>
  <text x="1029" y="362" font-size="14" fill="#1f2328" text-anchor="middle">Yahoo Finance</text>
  <text x="1029" y="384" font-size="14" fill="#1f2328" text-anchor="middle">mfapi.in · AMFI</text>
  <text x="1029" y="406" font-size="14" fill="#1f2328" text-anchor="middle">Frankfurter (FX)</text>
  <text x="1029" y="434" font-size="13" fill="#57606a" text-anchor="middle">free, keyless</text>

  <!-- Arrows -->
  <line x1="252" y1="180" x2="318" y2="180" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="285" y="170" font-size="13" fill="#57606a" text-anchor="middle">/api</text>
  <line x1="560" y1="180" x2="638" y2="180" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="599" y="170" font-size="13" fill="#57606a" text-anchor="middle">SQL</text>
  <path d="M440,250 L440,376 L638,376" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="452" y="366" font-size="13" fill="#57606a">HTTP + JSON, zod-checked</text>
  <line x1="860" y1="376" x2="928" y2="376" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Shared packages -->
  <text x="32" y="506" font-size="16" font-weight="700" fill="#1f2328">Shared TypeScript packages</text>
  <rect x="32" y="522" width="528" height="90" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="52" y="552" font-size="15" font-weight="700" fill="#1f2328">packages/shared</text>
  <text x="52" y="576" font-size="14" fill="#57606a">zod contracts, decimal money, ledger replay, XIRR,</text>
  <text x="52" y="596" font-size="14" fill="#57606a">SIP and goal maths. Used by the web app and both APIs.</text>
  <rect x="580" y="522" width="548" height="90" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="600" y="552" font-size="15" font-weight="700" fill="#1f2328">packages/core</text>
  <text x="600" y="576" font-size="14" fill="#57606a">Accounts, trades, valuation, SIPs, goals, watchlist, with no</text>
  <text x="600" y="596" font-size="14" fill="#57606a">framework. Runs under NestJS here and on Workers in production.</text>
</svg>
